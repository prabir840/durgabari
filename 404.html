<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <meta name="theme-color" content="#0b0a08">

  <title>Page Not Found | Sri Radha Govinda Mandir</title>

  <meta name="description"
        content="The page you are looking for could not be found. Return to Sri Radha Govinda Mandir.">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
    }

    body {
      font-family: Georgia, "Times New Roman", serif;
      background:
        radial-gradient(circle at 50% 35%, rgba(212, 164, 75, 0.12), transparent 35%),
        #0b0a08;
      color: #f5ead2;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .page {
      width: 100%;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      position: relative;
    }

    .glow {
      position: absolute;
      width: 320px;
      height: 320px;
      border-radius: 50%;
      background: rgba(218, 168, 74, 0.08);
      filter: blur(70px);
      pointer-events: none;
    }

    .card {
      width: min(560px, 100%);
      padding: 48px 30px;
      text-align: center;

      background: rgba(255, 255, 255, 0.055);
      border: 1px solid rgba(218, 168, 74, 0.28);
      border-radius: 24px;

      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);

      box-shadow:
        0 25px 70px rgba(0, 0, 0, 0.45),
        inset 0 1px 0 rgba(255, 255, 255, 0.08);
    }

    .om {
      font-size: 52px;
      color: #e3b65d;
      margin-bottom: 12px;
      line-height: 1;
    }

    .error {
      font-family: Arial, sans-serif;
      font-size: clamp(76px, 20vw, 130px);
      font-weight: 700;
      line-height: 1;
      letter-spacing: 6px;
      color: #e3b65d;
      text-shadow: 0 0 35px rgba(227, 182, 93, 0.18);
    }

    h1 {
      margin-top: 16px;
      font-size: clamp(25px, 6vw, 38px);
      font-weight: 500;
    }

    .message {
      max-width: 430px;
      margin: 16px auto 0;
      color: rgba(245, 234, 210, 0.72);
      font-family: Arial, sans-serif;
      font-size: 15px;
      line-height: 1.7;
    }

    .mantra {
      margin-top: 24px;
      color: #d9ad57;
      font-size: 18px;
    }

    .home-btn {
      display: inline-block;
      margin-top: 30px;
      padding: 13px 25px;

      color: #17120a;
      background: linear-gradient(135deg, #f0c96e, #c9983d);

      border-radius: 999px;
      text-decoration: none;
      font-family: Arial, sans-serif;
      font-size: 14px;
      font-weight: 700;

      transition:
        transform 0.25s ease,
        box-shadow 0.25s ease;
    }

    .home-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 30px rgba(218, 168, 74, 0.22);
    }

    .divider {
      width: 80px;
      height: 1px;
      margin: 28px auto 0;
      background: linear-gradient(
        90deg,
        transparent,
        #d9ad57,
        transparent
      );
    }

    .temple-name {
      margin-top: 20px;
      font-family: Arial, sans-serif;
      font-size: 12px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: rgba(245, 234, 210, 0.48);
    }

    @media (max-width: 480px) {
      .page {
        padding: 16px;
      }

      .card {
        padding: 38px 20px;
        border-radius: 20px;
      }

      .om {
        font-size: 44px;
      }

      .message {
        font-size: 14px;
      }
    }
  </style>
</head>

<body>

  <main class="page">

    <div class="glow"></div>

    <section class="card">

      <div class="om">ॐ</div>

      <div class="error">404</div>

      <h1>Page Not Found</h1>

      <p class="message">
        The page you are looking for may have been moved,
        removed, or does not exist.
      </p>

      <div class="mantra">
        ॥ राधे राधे ॥
      </div>

      <div class="divider"></div>

      <a href="./index.html" class="home-btn">
        ← Return to Mandir
      </a>

      <div class="temple-name">
        Sri Radha Govinda Mandir · Sakchi, Jamshedpur
      </div>

    </section>

  </main>

</body>
</html>
